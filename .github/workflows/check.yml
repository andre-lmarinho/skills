name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: python -m pip install -r scripts/requirements.txt
      - run: npm install --global @anthropic-ai/claude-code@2.1.220
      - name: Validate skills and manifests
        run: |
          curl --fail --silent --show-error --location \
            https://agent-plugins.org/schemas/1.0.0/plugin.schema.json \
            --output "$RUNNER_TEMP/agent-plugin.schema.json"
          python scripts/check.py --schema "$RUNNER_TEMP/agent-plugin.schema.json"
      - name: Check packaging and versioning
        run: python scripts/test_package.py
